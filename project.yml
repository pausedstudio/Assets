name: Assets
options:
  bundleIdPrefix: com.paused
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Assets:
    type: application
    platform: macOS
    sources:
      - path: Assets
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paused.Assets
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Assets
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_OBJC_BRIDGING_HEADER: Assets/Assets-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Assets/Private Headers"
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: AssetCatalogKit
        embed: true
    info:
      path: Assets/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Asset Catalog
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.apple.assetcatalog.compiled
          - CFBundleTypeName: Bundle
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.bundle
              - com.apple.package
          - CFBundleTypeName: Application
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.application-bundle
          - CFBundleTypeName: Core Animation Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.apple.coreanimation-archive
          - CFBundleTypeName: Core Animation Bundle
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.apple.coreanimation-bundle
        UTImportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Compiled Asset Catalog
            UTTypeIdentifier: com.apple.assetcatalog.compiled
            UTTypeTagSpecification:
              public.filename-extension:
                - car
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Core Animation Archive
            UTTypeIdentifier: com.apple.coreanimation-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - caar
                - caml
          - UTTypeConformsTo:
              - com.apple.package
            UTTypeDescription: Core Animation Bundle
            UTTypeIdentifier: com.apple.coreanimation-bundle
            UTTypeTagSpecification:
              public.filename-extension:
                - ca
    entitlements:
      path: Assets/Assets.entitlements
      properties:
        com.apple.security.app-sandbox: false

  AssetCatalogKit:
    type: framework
    platform: macOS
    sources:
      - path: AssetCatalogKit/Source
      - path: AssetCatalogKit/AssetCatalogKit.h
        headerVisibility: public
      - path: AssetCatalogKit/Private Headers
        headerVisibility: project
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paused.AssetCatalogKit
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/AssetCatalogKit/Private Headers"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        FRAMEWORK_SEARCH_PATHS:
          - "/System/Library/PrivateFrameworks"
        OTHER_LDFLAGS:
          - "-weak_framework"
          - "CoreUI"
          - "-weak_framework"
          - "CoreSVG"
        MODULEMAP_FILE: ""
    info:
      path: AssetCatalogKit/Info.plist
      properties:
        CFBundlePackageType: FMWK

  AssetCatalogQuickLook:
    type: app-extension
    platform: macOS
    product: com.apple.product-type.quicklook-previewer
    sources:
      - path: AssetCatalogQuickLook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paused.Assets.QuickLook
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
    dependencies:
      - target: AssetCatalogKit
        embed: true
    info:
      path: AssetCatalogQuickLook/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - com.apple.assetcatalog.compiled
            QLSupportsSearchableItems: false
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
